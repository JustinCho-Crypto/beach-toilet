<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>바닷가 화장실</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app">
    <main id="view-map" class="view">
      <div id="map-container"></div>
      <div id="map-chip" class="map-chip" hidden><span class="dot"></span><span id="map-chip-text"></span></div>
      <div id="chiprow" class="chiprow">
        <button class="fchip on" data-filter="all">전체</button>
        <button class="fchip" data-filter="beach">해수욕장</button>
        <button class="fchip" data-filter="valley">계곡</button>
        <button class="fchip" data-filter="toilet">화장실</button>
        <button class="fchip" data-filter="shower">샤워실</button>
      </div>
      <button id="btn-locate" class="locfab" aria-label="현재 위치로 이동">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="4.2" stroke="#4E5968" stroke-width="1.8"/><g stroke="#4E5968" stroke-width="1.8" stroke-linecap="round"><path d="M9 0.8 V3.2"/><path d="M9 14.8 V17.2"/><path d="M0.8 9 H3.2"/><path d="M14.8 9 H17.2"/></g></svg>
      </button>
      <section id="spot-sheet" class="sheet" hidden></section>
    </main>

    <main id="view-points" class="view pointsview" hidden>
      <div id="points-root"></div>
    </main>

    <nav class="tabbar" id="tabbar">
      <div class="tab-indicator" id="tab-indicator"></div>
      <button class="tab active" data-tab="map">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 13.5 C7.5 13.5 2 8.6 2 5.4 C2 2.6 4.4 1 7.5 1 C10.6 1 13 2.6 13 5.4 C13 8.6 7.5 13.5 7.5 13.5Z" stroke="currentColor" stroke-width="1.7"/><circle cx="7.5" cy="5.4" r="1.7" fill="currentColor"/></svg>
        지도
      </button>
      <button class="tab" data-tab="points">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.7"/><path d="M5.4 7.5 L7 9.3 L9.8 5.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        포인트
      </button>
    </nav>

    <div id="ad-banner" class="adbanner"></div>
    <div id="report-dim" class="reportdim" hidden></div>
    <section id="report-sheet" class="sheet reportsheet" hidden></section>
    <div id="interstitial" class="interstitial" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </div>
</body>
</html>
